<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
<title id="title">How Megalodonte live reload works</title><desc id="desc">Project changes flow through detection, World, incremental compilation and validation before reaching every managed window in the client application.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#14213a"/></linearGradient><filter id="s"><feDropShadow dy="7" stdDeviation="8" flood-opacity=".35"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#94a3b8"/></marker><style>text{font-family:Inter,'DejaVu Sans',sans-serif}.h{fill:#f8fafc;font-size:34px;font-weight:700}.sub{fill:#94a3b8;font-size:16px}.t{fill:#f8fafc;font-size:20px;font-weight:700}.b{fill:#cbd5e1;font-size:14px}.sm{fill:#94a3b8;font-size:12px}.n{fill:#07111f;font-size:13px;font-weight:800}.card{fill:#152238;stroke-width:2}.line{fill:none;stroke:#94a3b8;stroke-width:2.5;marker-end:url(#a)}.pill{fill:#24344e}.warn{fill:#3b2a12;stroke:#fbbf24;stroke-width:2}.bad{fill:#3c1923;stroke:#fb7185;stroke-width:2}</style></defs>
<rect width="1440" height="940" rx="24" fill="url(#bg)"/><text x="52" y="58" class="h">Megalodonte live reload: from source change to every window</text><text x="52" y="88" class="sub">The running client changes only after an isolated generation compiles and validates successfully.</text>
<g filter="url(#s)"><rect x="52" y="145" width="220" height="190" rx="18" class="card" stroke="#38bdf8"/><circle cx="82" cy="177" r="17" fill="#38bdf8"/><text x="78" y="182" class="n">1</text><text x="110" y="184" class="t">Client project</text><text x="76" y="224" class="b">Save Java, resources</text><text x="76" y="248" class="b">or build configuration.</text><rect x="76" y="276" width="170" height="36" rx="9" class="pill"/><text x="92" y="299" class="b">megalodonte dev</text></g>
<g filter="url(#s)"><rect x="322" y="145" width="220" height="190" rx="18" class="card" stroke="#a78bfa"/><circle cx="352" cy="177" r="17" fill="#a78bfa"/><text x="348" y="182" class="n">2</text><text x="380" y="184" class="t">Detection</text><text x="346" y="224" class="b">Path + hash + Java tokens</text><text x="346" y="260" class="sm">First run: full manifest</text><text x="346" y="284" class="sm">Then: added/changed/deleted</text></g>
<g filter="url(#s)"><rect x="592" y="125" width="250" height="230" rx="18" class="card" stroke="#22d3ee"/><circle cx="622" cy="157" r="17" fill="#22d3ee"/><text x="618" y="162" class="n">3</text><text x="650" y="164" class="t">World</text><text x="616" y="205" class="b">Isolated project mirror</text><rect x="616" y="230" width="202" height="34" rx="9" class="pill"/><text x="630" y="252" class="sm">JSON manifest + deltas</text><rect x="616" y="274" width="202" height="34" rx="9" class="pill"/><text x="630" y="296" class="sm">SHA-256 content blobs</text><text x="616" y="332" class="sm">.env values never enter World</text></g>
<g filter="url(#s)"><rect x="892" y="145" width="220" height="190" rx="18" class="card" stroke="#f59e0b"/><circle cx="922" cy="177" r="17" fill="#f59e0b"/><text x="918" y="182" class="n">4</text><text x="950" y="184" class="t">Compilation</text><text x="916" y="224" class="b">Gradle + javac rebuild</text><text x="916" y="248" class="b">affected units/dependents.</text><text x="916" y="284" class="sm">Private classes + resources</text></g>
<g filter="url(#s)"><rect x="1162" y="145" width="226" height="190" rx="18" class="card" stroke="#34d399"/><circle cx="1192" cy="177" r="17" fill="#34d399"/><text x="1188" y="182" class="n">5</text><text x="1220" y="184" class="t">Validation</text><text x="1186" y="224" class="b">Freeze generation and</text><text x="1186" y="248" class="b">check class compatibility.</text><text x="1186" y="284" class="sm">Nothing applied before this</text></g>
<path d="M272 240h46M542 240h46M842 240h46M1112 240h46" class="line"/>
<path d="M1275 335v70H1030" class="line"/><text x="1045" y="388" class="sm">COMPILATION_RESULT returns to the client</text>
<g filter="url(#s)"><rect x="388" y="410" width="1000" height="220" rx="22" class="card" stroke="#60a5fa"/><circle cx="422" cy="445" r="18" fill="#60a5fa"/><text x="418" y="450" class="n">6</text><text x="454" y="452" class="t">Client application — receives metadata and changed artifacts</text><text x="422" y="484" class="b">status + diagnostics + artifactDelta: changed/deleted paths, SHA-256 and size. The whole project is not returned.</text><rect x="422" y="512" width="218" height="82" rx="12" class="pill"/><text x="438" y="538" class="t">1. Transfer</text><text x="438" y="562" class="sm">changed class/resource</text><text x="438" y="580" class="sm">bytes only</text><rect x="656" y="512" width="218" height="82" rx="12" class="pill"/><text x="672" y="538" class="t">2. Java agent</text><text x="672" y="562" class="sm">redefineClasses in the</text><text x="672" y="580" class="sm">same JVM process</text><rect x="890" y="512" width="218" height="82" rx="12" class="pill"/><text x="906" y="538" class="t">3. JavaFX thread</text><text x="906" y="562" class="sm">render existing screen</text><text x="906" y="580" class="sm">instances with State</text><rect x="1124" y="512" width="230" height="82" rx="12" class="pill"/><text x="1140" y="538" class="t">4. Atomic swap</text><text x="1140" y="562" class="sm">Scene.setRoot on main +</text><text x="1140" y="580" class="sm">all tracked spawned windows</text></g>
<text x="52" y="452" class="t">What stays alive?</text><text x="52" y="492" class="b">• Application process</text><text x="52" y="520" class="b">• Every Stage + Scene</text><text x="52" y="548" class="b">• Screen objects + State</text><text x="52" y="576" class="b">• Previous code on failure</text>
<text x="52" y="690" class="t">Safe outcomes when the success path cannot be used</text>
<g filter="url(#s)"><rect x="52" y="720" width="412" height="150" rx="18" class="bad"/><text x="78" y="758" class="t">Compilation or render fails</text><text x="78" y="796" class="b">Candidate is rejected. Running app keeps</text><text x="78" y="820" class="b">the last working version.</text><text x="78" y="850" class="sm">REJECTED — fix the code and save again</text></g>
<g filter="url(#s)"><rect x="514" y="720" width="412" height="150" rx="18" class="warn"/><text x="540" y="758" class="t">Class shape or dependency changes</text><text x="540" y="796" class="b">Standard JVM cannot redefine it safely.</text><text x="540" y="820" class="b">The client restarts with the new generation.</text><text x="540" y="850" class="sm">AUTOMATIC RESTART · STATE RESETS</text></g>
<g filter="url(#s)"><rect x="976" y="720" width="412" height="150" rx="18" class="warn"/><text x="1002" y="758" class="t">.env changes</text><text x="1002" y="796" class="b">Only path, size and hash are observed.</text><text x="1002" y="820" class="b">Secrets stay private; restart is required.</text><text x="1002" y="850" class="sm">RESTART_REQUIRED</text></g>
<text x="52" y="915" class="sm">Tokens improve change detection. Gradle compiles source units and the JVM activates classes; isolated fields are never compiled or copied as memory blocks.</text>
</svg>
