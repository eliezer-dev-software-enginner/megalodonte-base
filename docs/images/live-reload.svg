<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Megalodonte incremental compilation world</title><desc id="desc">A real project is mapped into JSON metadata and content blobs, compiled incrementally, then applied safely.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#94a3b8"/></marker><style>text{font-family:Inter,DejaVu Sans,sans-serif}.h{font-size:25px;font-weight:700;fill:#f8fafc}.t{font-size:17px;font-weight:700;fill:#f8fafc}.b{font-size:13px;fill:#cbd5e1}.x{fill:#172033;stroke-width:2}.l{stroke:#94a3b8;stroke-width:2;marker-end:url(#a)}</style></defs>
  <rect width="1100" height="520" rx="20" fill="#0f172a"/><text x="36" y="48" class="h">Live reload: project → virtual world → application</text>
  <rect class="x" x="36" y="92" width="220" height="120" rx="12" stroke="#38bdf8"/><text x="56" y="125" class="t">Real project</text><text x="56" y="153" class="b">Java + resources + build</text><text x="56" y="176" class="b">.env: hashes only</text>
  <rect class="x" x="306" y="92" width="270" height="120" rx="12" stroke="#a78bfa"/><text x="326" y="125" class="t">Incremental map</text><text x="326" y="153" class="b">Initial JSON manifest</text><text x="326" y="176" class="b">Then file, token and symbol deltas</text>
  <rect class="x" x="626" y="92" width="438" height="120" rx="12" stroke="#22d3ee"/><text x="646" y="125" class="t">Content-addressed virtual world</text><text x="646" y="153" class="b">SHA-256 blobs mirror sources and resources</text><text x="646" y="176" class="b">Unchanged files retain timestamps for Gradle</text><path class="l" d="M256 152H303"/><path class="l" d="M576 152H623"/>
  <rect class="x" x="36" y="278" width="300" height="126" rx="12" stroke="#34d399"/><text x="56" y="311" class="t">Gradle daemon + javac</text><text x="56" y="339" class="b">Compile divergent source units</text><text x="56" y="362" class="b">and affected dependents</text><text x="56" y="385" class="b">Tokens detect; class files activate</text>
  <rect class="x" x="400" y="278" width="300" height="126" rx="12" stroke="#fbbf24"/><text x="420" y="311" class="t">Compact JSON response</text><text x="420" y="339" class="b">Status and diagnostics</text><text x="420" y="362" class="b">Changed class/resource hashes</text><text x="420" y="385" class="b">No full project returned</text>
  <rect class="x" x="764" y="278" width="300" height="126" rx="12" stroke="#60a5fa"/><text x="784" y="311" class="t">Runtime activation</text><text x="784" y="339" class="b">Compatible: apply and rerender</text><text x="784" y="362" class="b">Structural/.env: replacement required</text><text x="784" y="385" class="b">Failure: keep the previous version</text><path class="l" d="M845 212V245H186V275"/><path class="l" d="M336 341H397"/><path class="l" d="M700 341H761"/>
  <text x="36" y="465" class="b">The protocol is shared by every Megalodonte application and contains no consumer-specific domain rules.</text><text x="36" y="490" class="b">Structural hot replacement with identical native windows still needs an activation mechanism beyond standard JVM redefinition.</text>
</svg>
